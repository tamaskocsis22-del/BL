<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BL • Élő transzfer</title><style>body{margin:0;background:#10120f;color:#f3f2eb;font:16px system-ui}main{max-width:630px;margin:8vh auto;padding:28px}small{color:#d4b775;letter-spacing:3px}h1{font:40px Georgia}.card{padding:24px;background:#1b1e19;border:1px solid #42473d;border-radius:16px;margin:24px 0}p{line-height:1.7;color:#bfc5b7}a,button{display:inline-block;color:#151810;background:#d4b775;padding:14px;border:0;border-radius:8px;text-decoration:none;font:inherit;cursor:pointer}.badge{color:#d4b775}#map[hidden]{display:none}</style><main><small>BLACK LIMOUSINE</small><h1>Transzfer élőben.</h1><div class="card"><strong id="status" class="badge">Kapcsolódás…</strong><p id="detail">Az aktuális transzfer állapotának lekérése.</p><p id="position"></p><a id="map" hidden target="_blank" rel="noopener noreferrer">Utolsó helyzet a Google Térképen ↗</a></div><p>Frissítés kb. 60 másodpercenként. A sofőr lezárt képernyőjén a böngésző szüneteltetheti a helyadatok küldését. Az utolsó pozíció nem feltétlenül az aktuális helyzet.</p><p id="expiry"></p></main><script>
const params=new URLSearchParams(location.hash.slice(1)),id=params.get('id'),token=params.get('token');const $=id=>document.getElementById(id);let timeout,terminal=false,last=null;
function clearPosition(){$('map').hidden=true;$('map').removeAttribute('href');$('position').textContent=''}
function display(d){last=d;const age=d.position?Date.now()-d.position.measuredAt:Infinity;const stale=age>150000;$('status').textContent=d.status==='ended'?'Követés leállítva':d.status==='paused'?'Szünet • helyadat nem látható':!d.position?'Várakozás helyadatra':stale?'Nincs friss helyadat':'LIVE • friss helyadat';$('detail').textContent=d.status==='ended'?'A sofőr leállította a megosztást.':d.status==='paused'?'A transzfer szünetel. A helymegosztás a folytatás után frissül.':d.position?'Utolsó mérés: '+new Date(d.position.measuredAt).toLocaleString('hu-HU')+' · '+Math.floor(age/60000)+' perce.':'A transzfer megosztása aktív, de még nincs pozíció.';$('expiry').textContent='A link érvényes: '+new Date(d.expiresAt).toLocaleString('hu-HU');if(d.position&&d.status!=='ended'){$('position').textContent='Helyzet: '+d.position.lat.toFixed(5)+', '+d.position.lng.toFixed(5)+' · Pontosság: kb. '+Math.round(d.position.accuracy)+' m';$('map').href='https://www.google.com/maps/search/?api=1&query='+d.position.lat+','+d.position.lng;$('map').hidden=false}else clearPosition();terminal=d.status==='ended'}
async function poll(){clearTimeout(timeout);if(document.hidden||terminal)return;if(!id||!token){$('status').textContent='Hiányzó követési link';$('detail').textContent='Nyisd meg a sofőrtől kapott teljes linket.';return}try{const r=await fetch('/api/live/'+encodeURIComponent(id),{headers:{'X-BL-View-Key':token},cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok){if([404,410].includes(r.status)){terminal=true;clearPosition();$('status').textContent='A link lejárt vagy érvénytelen';$('detail').textContent='Kérj új követési linket a sofőrtől.';return}throw Error('network')}display(await r.json())}catch{$('status').textContent='Kapcsolati hiba • nincs friss adat';$('detail').textContent='Az adatok frissítése nem sikerült. Újrapróbálás egy percen belül.';clearPosition()}if(!terminal&&!document.hidden)timeout=setTimeout(poll,60000)}document.addEventListener('visibilitychange',()=>{clearTimeout(timeout);if(!document.hidden)poll()});poll();
</script></html>
